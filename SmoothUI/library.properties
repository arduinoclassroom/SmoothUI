sentence=Smooth, animated menus for OLED and TFT displays: menus, lists, switches, sliders, choices, time pickers, timers, alerts and progress screens.
paragraph=One library for SSD1306/SH1106 OLEDs and ST7735/ST7789/ILI9341 TFTs - pick your display by uncommenting one line. Rows unfold, the selection glides and stretches, pages slide, long text scrolls. Works with a rotary encoder or push buttons. Built on Adafruit GFX.
