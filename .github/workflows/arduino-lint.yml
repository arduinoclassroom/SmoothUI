# Checks the library against the Arduino Library Manager rules on every push.
name: Arduino Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/arduino-lint-action@v3
        with:
          # SmoothUI is in Library Manager: check new releases against its rules.
          library-manager: update
          compliance: strict
